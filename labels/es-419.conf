# es-419 overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through es-419, then es, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 11 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
errors.file_name_invalid = Nombre de archivo no válido
errors.invalid_track_name = Nombre de track no válido
errors.track_already_exists = El track ya existe
errors.track_not_found = Track no encontrado
errors.cannot_delete_the_default_track = No se puede eliminar el track predeterminado
errors.paths_mismatch = Las rutas no coinciden: se esperaba {expected}, se obtuvo {got}. Use force=yes para sobrescribir.
