[labels]
app.name = အက်ပ် ထုတ်ဝေသူ

# Error messages used by a.error.label(...). Generated keys mirror
# the previous hardcoded a.error() literals.
errors.invalid_app_id = အက်ပ် ID မမှန်ကန်ပါ
errors.app_not_found = အက်ပ် မတွေ့ပါ
errors.invalid_app_name = အက်ပ် အမည် မမှန်ကန်ပါ
errors.invalid_privacy = ကိုယ်ရေးကိုယ်တာ မမှန်ကန်ပါ
errors.invalid_distribution = ဖြန့်ချိမှု မမှန်ကန်ပါ
errors.failed_to_create_app_entity = အက်ပ် အကောင့် ဖန်တီး၍မရပါ
errors.access_denied = ဝင်ရောက်ခွင့် မရှိပါ
errors.no_file_provided = ဖိုင် မပေးထားပါ
errors.failed_to_read_app_info_from_archive = မော်ကွန်း မှ အက်ပ် အချက်အလက် ဖတ်၍မရပါ
errors.invalid_track_name = ချန်နယ် အမည် မမှန်ကန်ပါ
errors.invalid_version = Version မမှန်ကန်ပါ
errors.version_not_found = Version မတွေ့ပါ
errors.track_already_exists = ချန်နယ် ရှိပြီးသား
errors.track_not_found = ချန်နယ် မတွေ့ပါ
errors.cannot_delete_the_default_track = မူရင်း ချန်နယ်ကို ဖျက်၍မရပါ
errors.paths_mismatch = လမ်းကြောင်းများ မကိုက်ညီပါ - မျှော်လင့်သည် {expected}၊ ရရှိသည် {got}။ အစားထိုးရန် force=yes ကိုသုံးပါ။

errors.app_installation_restricted_to_administrators = အက်ပ်ထည့်သွင်းခြင်းကို စီမံခန့်ခွဲသူများသာ ဆောင်ရွက်နိုင်သည်
errors.package_refused = ပက်ကေ့ဂျ်ကို ငြင်းပယ်လိုက်သည်: {reason}
