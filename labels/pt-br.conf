# pt-br overlay. Regional catalogues carry only what differs from the
# parent: a label resolves through pt-br, then pt, then en, key by key,
# so a copy of the parent's string overrides nothing today and pins this
# locale to it the moment the parent is reworded.
# 5 such copies were removed; what remains genuinely differs.
#
# The file itself stays even when nothing differs: its presence is what
# registers the locale in installed_languages, and so in the picker.

[labels]
app.name = Publicador de Apps
errors.invalid_app_id = ID do app inválido
errors.app_not_found = App não encontrado
errors.invalid_app_name = Nome do app inválido
errors.failed_to_create_app_entity = Falha ao criar entidade do app
errors.file_name_invalid = Nome de arquivo inválido
errors.failed_to_read_app_info_from_archive = Falha ao ler as informações do app a partir do arquivo
errors.invalid_track_name = Nome de trilha inválido
errors.track_already_exists = A trilha já existe
errors.track_not_found = Trilha não encontrada
errors.cannot_delete_the_default_track = Não é possível excluir a trilha padrão
errors.paths_mismatch = Caminhos não conferem: esperado {expected}, recebido {got}. Use force=yes para sobrescrever.
